name: Music generation

on:
  push:
    branches: [claude/video-file-loading-w1m816]
    paths: [.github/workflows/music-gen.yml, tools/music/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q gradio_client huggingface_hub
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run
        run: python tools/music/run.py
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/generated
          git commit -m "Add music generation output" || exit 0
          git pull --rebase -q origin ${GITHUB_REF_NAME}
          git push
