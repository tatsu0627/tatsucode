name: Fetch reference video

on:
  push:
    branches: [claude/video-file-loading-w1m816]
    paths: [.github/workflows/fetch-video.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download video
        run: |
          mkdir -p docs/reference
          curl -fsSL -A "Mozilla/5.0" -o docs/reference/Olvdt08t96BUmpXo.mp4 \
            "https://video.twimg.com/amplify_video/2103695379518967808/vid/avc1/1280x720/Olvdt08t96BUmpXo.mp4"
          ls -l docs/reference
      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/Olvdt08t96BUmpXo.mp4
          git commit -m "Add reference video from video.twimg.com"
          git push
